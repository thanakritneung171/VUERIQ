[package]
name = "vueriq"
version = "1.0.0"
description = "VUERIQ — Premium Universal Image & Video Viewer. See Every Detail."
authors = ["VUERIQ"]
license = "Proprietary"
edition = "2021"
rust-version = "1.80"

[lib]
name = "vueriq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rayon = "1.10"
crossbeam-channel = "0.5"
percent-encoding = "2.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "6"
log = "0.4"

# ── image decoding ──
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff", "tga", "qoi", "pnm", "hdr", "exr", "rayon"] }
jpeg-decoder = { version = "0.3", default-features = false }
libheif-rs = { version = "3", default-features = false, features = ["v1_23"] }
libheif-sys = { version = "5", default-features = false, features = ["v1_23"] }
rawler = "0.8"
jxl-oxide = "0.12"
resvg = "0.45"
qcms = "0.3"
kamadak-exif = "0.6"
fast_image_resize = { version = "5", features = ["rayon"] }

# ── video (libmpv is loaded at runtime) ──
libloading = "0.8"

# ── file operations (Recycle Bin delete / restore) ──
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
# Decoders are unusably slow unoptimised.
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true
